name = "virtual-gallery"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Deployed as a Worker with static assets, not a Pages project. `main` and
# `assets` are deliberately absent here: the Astro adapter emits them into
# dist/server/wrangler.json at build time, and naming a `main` that only exists
# after the build makes the build itself fail. Deploy with that generated file:
#   npx astro build && npx wrangler deploy --config dist/server/wrangler.json

[observability]
enabled = true

# Keep the workers.dev URL as a fallback target. It is unreliable from mainland
# China, but without it a failed custom-domain setup would leave no working URL.
workers_dev = true

# Custom domains for the Worker. Cloudflare creates and manages the DNS records
# for these itself (already proxied), which is why the zone needs no hand-written
# A records — the ones pointing at GitHub Pages belong to the old setup.
[[routes]]
pattern = "echogallery.art"
custom_domain = true

[[routes]]
pattern = "www.echogallery.art"
custom_domain = true

# Created in the APAC region, the closest primary to the site's readers.
# Local development uses wrangler's own SQLite file and ignores this id.
[[d1_databases]]
binding = "DB"
database_name = "virtual-gallery"
database_id = "54bc6a80-cce7-46e1-a3d9-1330f65ee809"

# Bucket for photo originals, replacing Cloudinary as photos are re-uploaded.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "virtual-gallery-photos"

# Backs Astro's session support, which the Cloudflare adapter enables by default.
[[kv_namespaces]]
binding = "SESSION"
id = "5dd7a5dff3f649ccbdef6ff709e91027"
